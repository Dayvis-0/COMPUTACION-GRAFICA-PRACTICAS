<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Curva Bézier Multi-Segmento</title>
        <style>
            :root { color-scheme: light dark; }

            body {
                padding: 20px;
                font-family: Arial, sans-serif;
                text-align: center;
            }

            canvas {
                border: 1px solid #555;
                display: block;
                margin: 10px auto;
            }

            .controls {
                margin: 15px 0;
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
                align-items: center;
            }

            button {
                padding: 8px 16px;
                border: 1px solid #888;
                border-radius: 6px;
                background: #333;
                color: #fff;
                cursor: pointer;
                font-size: 0.95em;
            }

            button:hover { background: #555; }
            button.danger { border-color: #f44; }
            button.success { border-color: #4f4; }

            .toggle-btn {
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.95em;
                border: 2px solid;
                background: #333;
                color: #fff;
            }

            .toggle-btn.on { border-color: #4f4; }
            .toggle-btn.off { border-color: #f44; }

            .info-bar {
                display: flex;
                justify-content: center;
                gap: 30px;
                flex-wrap: wrap;
                margin: 10px 0;
                font-size: 0.95em;
            }

            .legend {
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
                margin: 10px 0;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 0.85em;
            }

            .color-dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                border: 1px solid #888;
            }

            hr {
                border: none;
                border-top: 1px solid #444;
                margin: 16px auto;
                max-width: 600px;
            }
        </style>
    </head>
    <body>
        <h1>Curva Bézier Multi-Segmento</h1>
        <p style="color: #888; font-size: 0.9em;">
            Arrastrá los puntos de control. La continuidad C1 mantiene las tangentes suaves entre segmentos.
        </p>

        <canvas id="glcanvas" width="700" height="500"></canvas>

        <div class="controls">
            <button id="btnAddSeg" class="success">+ Agregar segmento</button>
            <button id="btnRemoveSeg" class="danger">− Quitar segmento</button>
            <button id="btnReset" class="danger">↺ Reset</button>
            <button id="btnToggleC1" class="toggle-btn on">C1: ON</button>
        </div>

        <div class="info-bar">
            <span><strong>Segmentos:</strong> <span id="segCount">2</span></span>
            <span><strong>Puntos de control:</strong> <span id="ptCount">8</span></span>
        </div>

        <hr>

        <div class="legend">
            <div class="legend-item">
                <div class="color-dot" style="background: #888;"></div>
                <span>Polígono de control</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: #f44;"></div>
                <span>Punto libre</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: #ff0;"></div>
                <span>Punto de unión (C0)</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: #f6f;"></div>
                <span>Punto restringido (C1)</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: #fff; width: 24px; height: 2px; border-radius: 0;"></div>
                <span>Reflejo de tangente (C1)</span>
            </div>
        </div>

        <div class="legend" id="segLegend">
            <!-- Se llena con JS -->
        </div>

        <script src="Curva-Compleja.js"></script>
    </body>
</html>
