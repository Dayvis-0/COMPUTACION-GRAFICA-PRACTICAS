<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Comparación: Bernstein vs De Casteljau</title>
        <style>
            :root { color-scheme: light dark; }

            body {
                padding: 20px;
                font-family: Arial, sans-serif;
                text-align: center;
            }

            .canvas-container {
                display: flex;
                justify-content: center;
                gap: 30px;
                flex-wrap: wrap;
                margin: 10px 0;
            }

            .canvas-wrapper {
                text-align: center;
            }

            .canvas-wrapper h2 {
                margin: 0 0 8px 0;
                font-size: 1.1em;
            }

            .canvas-wrapper canvas {
                border: 1px solid #555;
                display: block;
            }

            .info {
                display: flex;
                justify-content: center;
                gap: 40px;
                flex-wrap: wrap;
                margin: 20px 0;
            }

            .card {
                border: 1px solid #555;
                border-radius: 8px;
                padding: 12px 24px;
                min-width: 200px;
            }

            .card h3 { margin: 0 0 8px 0; }

            .tiempo { font-size: 1.3em; font-weight: bold; }

            .diferencias {
                margin: 15px auto;
                padding: 10px 20px;
                border: 1px solid #555;
                border-radius: 8px;
                display: inline-block;
            }

            .btn-group {
                margin: 15px 0;
            }

            button {
                padding: 8px 20px;
                margin: 0 8px;
                border: 1px solid #888;
                border-radius: 6px;
                background: #333;
                color: #fff;
                cursor: pointer;
                font-size: 1em;
            }

            button:hover { background: #555; }

            button.reset { border-color: #f44; }

            .resolution-control {
                margin: 10px 0;
            }

            input[type="range"] {
                width: 300px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <h1>Comparación: Bernstein vs De Casteljau</h1>

        <div class="resolution-control">
            <label>Resolución: <span id="resValue">200</span></label>
            <input type="range" id="resolutionSlider" min="10" max="500" value="200" step="10">
        </div>

        <div class="btn-group">
            <button id="btnBenchmark">▶ Ejecutar Benchmark (100 iteraciones)</button>
            <button id="btnReset" class="reset">↺ Reset puntos</button>
        </div>

        <div class="canvas-container">
            <div class="canvas-wrapper">
                <h2 style="color: #ff0;">De Casteljau</h2>
                <canvas id="canvasCasteljau" width="450" height="450"></canvas>
            </div>
            <div class="canvas-wrapper">
                <h2 style="color: #0ff;">Bernstein</h2>
                <canvas id="canvasBernstein" width="450" height="450"></canvas>
            </div>
        </div>

        <div class="info">
            <div class="card" style="border-color: #ff0;">
                <h3>De Casteljau</h3>
                <div class="tiempo" id="tiempoCasteljau">— ms</div>
            </div>
            <div class="card" style="border-color: #0ff;">
                <h3>Bernstein</h3>
                <div class="tiempo" id="tiempoBernstein">— ms</div>
            </div>
        </div>

        <div class="diferencias">
            <strong>Diferencia máxima entre curvas:</strong>
            <span id="diffMax">—</span>
        </div>

        <p style="margin-top: 20px; font-size: 0.85em; color: #888;">
            Arrastrá los puntos de control haciendo clic y moviendo el mouse.
        </p>

        <script src="Comparacion-Beziers.js"></script>
    </body>
</html>
