<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Primitivas</title>
        <style>
            :root {
                color-scheme: light dark;
                padding: 100px;
            }q

            canvas {
                border: 1px solid #fff;
            }

            .text {
                text-align: center;
            }

            .div-canvas {
                display: flex;
                justify-content: center;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <h1 class="text">Primitivas</h1>
        <div class="div-canvas">
            <div style="text-align: center; margin-top: 20px;">
                <label for="primitiva">Seleccionar Primitiva: </label>
                <select id="primitiva">
                    <option value="POINTS">POINTS</option>
                    <option value="LINES">LINES</option>
                    <option value="LINE_STRIP">LINE_STRIP</option>
                    <option value="LINE_LOOP">LINE_LOOP</option>
                    <option value="TRIANGLES">TRIANGLES</option>
                    <option value="TRIANGLE_STRIP">TRIANGLE_STRIP</option>
                    <option value="TRIANGLE_FAN">TRIANGLE_FAN</option>
                </select>
                <button id="btnDibujar">Dibujar</button>
            </div>
            <canvas
                id="glcanvas"
                width="500"
                height="500"
            ></canvas>
        </div>
        <script src="Primitivas2.js"></script>
    </body>
</html>
