<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Múltiples Transformaciones</title>
        <style>
            :root {
                color-scheme: light dark;
                padding: 100px;
            }

            .div-canvas {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                border: 1px solid #fff;
            }
            
            .info {
                text-align: center;
                margin-top: 20px;
                color: #666;
            }
        </style>
    </head>
    <body>
        <h1>Transformaciones Independientes (3 Cuadrados)</h1>
        <div class="div-canvas">
            <canvas
                id="glcanvas"
                width="500"
                height="500"
            ></canvas>
        </div>
        <div class="info">
            <p>Cada cuadrado tiene su propia matriz de transformación y color</p>
            <p>Duplicación de buffers para cada objeto</p>
        </div>
        <script src="Transformacionesep4.js"></script>
    </body>
</html>
