<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movimiento con Wrap</title>
        <style>
            :root {
                color-scheme: light dark;
            }

            body {
                padding: 20px;
                font-family: Arial, sans-serif;
            }

            h1 {
                text-align: center;
            }

            .menu {
                text-align: center;
                margin-bottom: 20px;
            }

            .menu button {
                padding: 10px 20px;
                margin: 0 5px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                background: #444;
                color: #ccc;
            }

            .menu button.active {
                background: #4CAF50;
                color: white;
            }

            .div-canvas {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                border: 1px solid #fff;
            }
        </style>
    </head>
    <body>
        <h1>Movimiento con Wrap</h1>
        
        <div class="menu">
            <button id="btn-circulo" class="active" onclick="setShape('circulo')">Círculo</button>
            <button id="btn-cuadrado" onclick="setShape('cuadrado')">Cuadrado</button>
            <button id="btn-triangulo" onclick="setShape('triangulo')">Triángulo</button>
        </div>

        <div class="div-canvas">
            <canvas id="glcanvas" width="500" height="500"></canvas>
        </div>

        <script src="Transformacionesep6.js"></script>
    </body>
</html>
